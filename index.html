<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#fff4dc"><title>유생런</title><link rel="preload" href="assets/fonts/GamjaFlower-Game.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="style.css"><script src="game.js" defer></script></head>
<body><main>

<section class="intro"><h1>유생런</h1><p>귤을 찾아 떠나는 특별한 과거시험</p></section>
<section class="game" aria-label="유생런 게임">
<canvas id="game" width="1100" height="500" tabindex="0" aria-label="자동으로 달리는 유생. 스페이스바 / 화면 터치 · 최대 2단 점프"></canvas>
<div class="hud"><div class="score-panel"><img src="assets/ui/기타이미지12.png" alt=""><strong id="score" aria-label="점수">0</strong></div><div class="health-panel"><img src="assets/ui/기타이미지14.png" alt=""><div class="health-track"><div id="health-fill"></div></div><span id="health">3 / 3</span></div><button id="pause" class="image-button" aria-label="일시 정지" disabled><img src="assets/ui/기타이미지15.png" alt=""></button></div>
<div id="overlay" class="overlay"><div id="welcome" class="welcome"><h2 id="overlay-title">황감제에 도전하시오!</h2><p id="overlay-description">성균관에 특별한 시험이 열렸도다.<br>장애물을 뛰어넘고 귤을 모아<br>장원급제의 영광을 차지해 보시오!</p><img class="welcome-character" src="assets/characters/캐릭어이미지1.png" alt="파란 도포를 입은 유생"><button id="start" class="image-button start-button" aria-label="시작하기"><img src="assets/ui/기타이미지11.png" alt=""><span class="button-label">시작하기</span></button><small id="loading">그림을 불러오는 중…</small></div>
<div id="result" class="result" hidden role="group" aria-labelledby="result-title"><img src="assets/ui/기타이미지13.png" alt="" aria-hidden="true"><span class="result-legacy-button-cover" aria-hidden="true"></span><h2 id="result-title" class="result-title">황감제 결과 발표</h2><p id="result-caption" class="result-caption">그대의 성적은?</p><strong id="final-score" aria-describedby="result-caption">0점</strong><button id="restart" aria-label="다시 도전하겠소"><span>다시 도전하겠소</span></button></div>
<div id="paused" class="paused" hidden><h2>잠시 쉬어가게나</h2><button id="resume" class="pill">다시 달려보세</button></div></div>
<div class="effect-timers"><span id="boost" class="timer timer-speed" hidden title="가속 남은 시간"><span id="boost-time">5초</span></span><span id="giant" class="timer timer-giant" hidden title="거대화 남은 시간"><span id="giant-time">5초</span></span></div><div class="game-footer"><span id="distance">0 m</span></div></section>
<div class="guide"><span><kbd>SPACE</kbd> / 화면 터치 · 최대 2단 점프</span><span><img src="assets/items/귤2.png" alt="귤"> 귤 하나 +100점</span></div>
<p id="asset-warning" hidden role="alert"></p><p id="status" class="sr-only" role="status" aria-live="polite"></p>
</main></body></html>
